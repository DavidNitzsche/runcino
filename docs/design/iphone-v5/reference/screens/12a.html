  <div id="12a" style="display:flex;flex-direction:column;gap:16px;width:390px" data-screen-label="12">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--signal);color:var(--action-primary-text);font-size:13px;font-weight:700">12a</span>
      <span style="font-size:15px">Live run</span>
    </div>

    <div style="width:390px;height:844px;background:#000;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 32px 80px -24px rgba(0,0,0,.85)">
      <div style="height:40px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px;font-weight:600;color:var(--text-quiet)">
        <span>6:04</span>
        <span style="display:flex;gap:6px;align-items:center;opacity:.7">
          <span style="width:15px;height:10px;border-radius:2px;background:var(--text-quiet);display:block"></span>
          <span style="width:22px;height:10px;border-radius:3px;background:var(--text-quiet);display:block"></span>
        </span>
      </div>

      <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 20px 0;gap:16px">

        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <span class="faff-value" style="font-size:34px;color:var(--text-primary)">{{ liveRun.elapsed }}</span>
          <span class="faff-value" style="font-size:22px;color:var(--signal)">{{ liveRun.type }}</span>
        </div>

        <div style="flex:0 0 auto;border-radius:24px;background:var(--material-tile);padding:16px 12px;display:grid;grid-template-columns:1fr 1fr;text-align:center">
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:14px;letter-spacing:.04em;color:var(--text-quiet)">DIST</span>
            <span class="faff-value" style="font-size:32px;color:var(--text-primary)">{{ liveRun.miDone }}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:14px;letter-spacing:.04em;color:var(--text-quiet)">OF</span>
            <span class="faff-value" style="font-size:32px;color:var(--text-primary)">{{ liveRun.miTotal }} mi</span>
          </div>
        </div>

        <div style="flex:1.1;min-height:0;border-radius:28px;background:var(--material-tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px">
          <span style="font-size:18px;letter-spacing:.06em;color:var(--text-secondary)">PACE</span>
          <span class="faff-value" style="font-size:72px;line-height:1;color:var(--text-primary)">{{ liveRun.paceShort }}</span>
          <x-import component-from-global-scope="FaffRunDesignSystem_1f682c.RangeScale" hint-size="100%,56px" mode="band" min="{{ 420 }}" max="{{ 560 }}" band="{{ liveRun.band }}" value="{{ liveRun.pace }}" endpoints="{{ liveRun.paceEnds }}" hue="pace" surface="tile" size="s"></x-import>
        </div>

        <div style="flex:1.1;min-height:0;border-radius:28px;background:var(--material-tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px">
          <span style="font-size:18px;letter-spacing:.06em;color:var(--text-secondary)">HEART RATE</span>
          <span class="faff-value" style="font-size:72px;line-height:1;color:var(--text-primary)">{{ liveRun.hr }}</span>
          <x-import component-from-global-scope="FaffRunDesignSystem_1f682c.RangeScale" hint-size="100%,56px" mode="ceiling" min="{{ 100 }}" max="{{ 190 }}" band="{{ liveRun.hrBand }}" value="{{ liveRun.hr }}" endpoints="{{ liveRun.hrEnds }}" hue="heart" surface="tile" size="s"></x-import>
        </div>

        <span class="faff-value" style="font-size:20px;line-height:1.2;color:var(--text-primary);text-align:center;padding:0 4px">{{ liveRun.interval }}</span>
      </div>

      <div style="flex:0 0 auto;padding:14px 20px 30px;display:flex;gap:10px">
        <x-import component-from-global-scope="FaffRunDesignSystem_1f682c.Button" hint-size="100%,60px" variant="secondary" size="lg" full="{{ true }}" onClick="{{ raceDetail.noop }}">Pause</x-import>
        <x-import component-from-global-scope="FaffRunDesignSystem_1f682c.Button" hint-size="100%,60px" variant="destructive" size="lg" full="{{ true }}" onClick="{{ raceDetail.noop }}">End</x-import>
      </div>
    </div>
  </div>
