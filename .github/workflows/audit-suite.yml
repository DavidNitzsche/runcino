# Do the PRODUCTION-BACKED audits pass?
#
# WHY THIS EXISTS — the most expensive false green found in the core-closure
# programme, and the one that hid two others.
#
# 28 `*.audit.test.ts` files read live production over the read-only role. Every
# one of them is `describe.skipIf(!process.env.DATABASE_URL_RO)`. Neither
# `test-full.yml` nor Railway carries that credential, so all 28 skip — and a
# skipped Vitest file is reported as `skipped`, never as `failed`. The suite
# goes green.
#
# On 2026-09-04 THREE of them were failing against production all day while
# `test-full` and Railway both reported green:
#
#   · `_cross_surface_contract.test.ts` — the Rule 16 enforcement for EVERY
#     race number the iPhone renders. It could not pass in any environment that
#     actually ran it.
#   · `_today_thesis.audit.test.ts` and `_voice_live.audit.test.ts` — the
#     coaching voice on the real `/api/v5/today` payload.
#
# Rule 18's central case: a gate that cannot fail anywhere it runs. This job is
# the fix, and its whole design principle is:
#
#     A PRODUCTION AUDIT THAT DID NOT RUN IS A FAILURE, NOT A PASS.
#
# So the missing credential is an explicit, loud, NAMED failure rather than a
# graceful skip. This job ends by printing exactly one of three words:
#
#     PASS                        the audits ran and every assertion held
#     FAIL                        the audits ran and something is wrong
#     BLOCKED_MISSING_CREDENTIAL  the audits DID NOT RUN
#
# The third is non-green and is never reported as a skip. Rule 11: "it passed",
# "it failed" and "it never ran" are three facts, and this job used to have
# only two words for them. The state is written to `$GITHUB_STEP_SUMMARY` as
# well as stdout, so it survives log truncation.
#
# ── SETUP, ONE TIME, BY THE REPO OWNER ─────────────────────────────────────
#
# Full instructions, including the click-path and the two safety layers, are in
# `docs/reports/core-closure-2026-09-04/CI-FALSIFICATION.md` §4. In short:
#
#   Repository → Settings → Secrets and variables → Actions → Repository
#   secrets → New repository secret
#     Name:   DATABASE_URL_RO          (exact, case-sensitive)
#     Secret: the read-only connection string web-v2/.env.local already carries
#
# It is the `faff_readonly` role: SELECT only, no INSERT/UPDATE/DELETE, no DDL.
# `lib/verify/production-barrier.ts` is the second, independent layer — it
# refuses any non-read statement issued from a verification process (`VITEST` is
# set, so every file here is fenced) and there is deliberately no opt-out. Two
# layers, either of which alone stops a write.
#
# NO CODE CHANGE IS NEEDED once the secret exists. The job reads it by name on
# the next run. Until then it reports BLOCKED_MISSING_CREDENTIAL, by design.
#
# The value is never echoed, logged, written to a step output, or put in the
# summary. Only its emptiness is read.
#
# ── WHAT THIS JOB CANNOT FAIL ON (Rule 22) ─────────────────────────────────
#
#   · anything the audits do not assert. It runs one runner's real account, so
#     it is evidence about that account (the file headers say so themselves).
#   · a defect that needs a device. See PHYSICAL-TESTS.md.
#   · scheduling. It cannot prove a cron ran; it can only see the row a cron
#     left behind, which is what the freshness assertions in
#     `_cross_surface_contract.test.ts` were added to do.
name: audit-suite

on:
  push:
    branches: [main]
  schedule:
    # Once a day, because these read LIVE data: an audit that passed on the
    # commit can fail tomorrow on the same code when a cron stops running or a
    # stamp goes stale. That is the class `_cross_surface_contract.test.ts`'s
    # freshness check exists for, and a push-only trigger cannot see it.
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: audit-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      # ── TRI-STATE, STEP 1 OF 2 · classify, do not yet decide ─────────────
      #
      # This step RECORDS whether the credential exists and never exits
      # non-zero, so the verdict step below always runs and always writes a
      # state. A first step that exits 1 skips every later step, including the
      # one that writes `$GITHUB_STEP_SUMMARY` — and a job whose only signal is
      # a red X does not distinguish "the audits ran and found a defect" from
      # "the audits never ran". Rule 11: those are two different facts, and
      # collapsing them is what this whole file exists to stop.
      #
      # It reads EMPTINESS ONLY. The value is never echoed, never written to an
      # output, never put in the summary, and never passed anywhere but to
      # vitest's own env.
      - name: Is the credential present
        id: cred
        env:
          DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
        run: |
          if [ -z "${DATABASE_URL_RO:-}" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::error title=Production audits did not run::DATABASE_URL_RO is not set."
            echo ""
            echo "All 28 *.audit.test.ts files are describe.skipIf(!DATABASE_URL_RO)."
            echo "Without the credential they SKIP, and a skipped file reports as"
            echo "green. Three of them were red against production for a full day"
            echo "while every other signal said clean."
            echo ""
            echo "A production audit that did not run is a FAILURE, not a PASS."
            echo "See the SETUP section at the top of this file, and"
            echo "docs/reports/core-closure-2026-09-04/CI-FALSIFICATION.md §4."
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
            echo "credential present"
          fi

      - name: Install
        if: steps.cred.outputs.present == 'yes'
        working-directory: web-v2
        run: npm ci --prefer-offline --no-audit

      # `--testNamePattern=''` was dropped from this command. An empty pattern
      # is a regex that matches everything, so it did nothing — but a filter
      # flag that reads as a filter and silently narrows nothing is one edit
      # away from silently narrowing everything, and this job's entire subject
      # is suites that quietly stop running.
      - name: Run only the production-backed audits
        if: steps.cred.outputs.present == 'yes'
        working-directory: web-v2
        env:
          DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
        run: |
          set -o pipefail
          FILES=$(git ls-files 'lib/**/*.audit.test.ts' | tr '\n' ' ')
          echo "audit files matched: $(printf '%s' "$FILES" | wc -w)"
          rc=0
          npx vitest run $FILES 2>&1 | tee /tmp/audits.log || rc=$?
          echo "$rc" > /tmp/audits.rc
          echo "vitest exit code: $rc"

      # ── TRI-STATE, STEP 2 OF 2 · exactly one of three words ──────────────
      #
      #   PASS                        the audits ran against production and
      #                               every assertion held.
      #   FAIL                        the audits ran and something is wrong.
      #   BLOCKED_MISSING_CREDENTIAL  the audits did NOT run. Distinct from
      #                               both of the above, non-green, and never
      #                               reported as a skip.
      #
      # `if: always()` is load-bearing: the state must be written even when an
      # earlier step failed or was skipped, otherwise the summary is silent in
      # exactly the cases it matters most.
      #
      # LIVENESS (Rule 18 guard 2) is folded in here rather than living in its
      # own step, so one place decides the verdict (Rule 16). Vitest exits 0
      # when every file skipped, so the exit code alone cannot tell "28 audits
      # passed" from "28 audits were skipped and nobody noticed".
      #
      # WHAT THIS VERDICT CANNOT FAIL ON (Rule 22):
      #   · a PASS that read the wrong rows. It counts assertions, not truth.
      #   · a suite that shrinks from 212 assertions to 25. The floor of 20 is
      #     a liveness probe, not a ratchet — it separates "ran" from "did not
      #     run", and nothing here derives a declared count from the sources.
      #   · an audit file that exists but matches no glob. The matched-file
      #     count is printed above and is evidence; it is not asserted on,
      #     because a legitimate rename would then fail for the wrong reason.
      #   · anything about whether the credential is genuinely READ-ONLY. That
      #     is `lib/verify/production-barrier.ts` and the `faff_readonly` grant,
      #     two layers this job assumes and does not verify.
      - name: Verdict
        if: always()
        env:
          CRED_PRESENT: ${{ steps.cred.outputs.present }}
        run: |
          FLOOR=20
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          STATE=""
          REASON=""

          if [ "${CRED_PRESENT:-no}" != "yes" ]; then
            STATE="BLOCKED_MISSING_CREDENTIAL"
            REASON="DATABASE_URL_RO is not set, so all 28 *.audit.test.ts files would have skipped. The audits did not run."
          elif [ ! -f /tmp/audits.rc ]; then
            STATE="FAIL"
            REASON="The audit run did not complete — no exit code was recorded. Treated as a failure, never as a skip."
          else
            RC=$(cat /tmp/audits.rc)
            # Read the `Tests` line, then the passed count off it. Two traps,
            # both hit while falsifying this (rows E5/E6):
            #   · a FAILING run prints `Tests  9 failed | 203 passed (212)`, so
            #     an anchored `Tests +[0-9]+ passed` matches nothing and the
            #     reason line claimed "0 assertions passed" over a run with 203.
            #     The state was right and the sentence was false — Rule 16.
            #   · `Test Files  28 passed (28)` also contains "N passed", so the
            #     line must be selected before the number is. `Tests` followed
            #     by whitespace excludes `Test Files` without depending on
            #     which line vitest prints last.
            TLINE=$(grep -E '^[[:space:]]*Tests[[:space:]]' /tmp/audits.log 2>/dev/null | tail -1 || true)
            PASSED=$(printf '%s' "$TLINE" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || true)
            PASSED="${PASSED:-0}"
            echo "--- vitest summary ---"
            grep -E 'Test Files|Tests ' /tmp/audits.log 2>/dev/null | tail -3 || echo "(no summary lines)"
            echo "audit assertions executed: ${PASSED} (floor ${FLOOR})"
            if [ "$RC" -ne 0 ]; then
              STATE="FAIL"
              REASON="vitest exited ${RC}. ${PASSED} assertions passed before it stopped."
            elif [ "$PASSED" -lt "$FLOOR" ]; then
              STATE="FAIL"
              REASON="Only ${PASSED} audit assertions ran (floor ${FLOOR}). The credential is set but the suite skipped anyway — that is the false green again."
            else
              STATE="PASS"
              REASON="${PASSED} production-backed audit assertions ran and passed."
            fi
          fi

          # Guard the guard (Rule 18 §3). A tri-state that can print a fourth
          # word, or none, is not a tri-state. This branch is unreachable by
          # construction, which is exactly why it is here: the construction is
          # what a later edit changes.
          case "$STATE" in
            PASS|FAIL|BLOCKED_MISSING_CREDENTIAL) ;;
            *)
              echo "::error title=Verdict logic broke::computed state '${STATE}' is not one of the three."
              exit 1
              ;;
          esac

          {
            echo "## audit-suite: ${STATE}"
            echo ""
            echo "${REASON}"
            echo ""
            echo "\`PASS\` · \`FAIL\` · \`BLOCKED_MISSING_CREDENTIAL\` are the only three"
            echo "outcomes. A production audit that did not run is not a pass."
          } >> "$SUMMARY"

          echo "AUDIT-SUITE: ${STATE}"
          echo "${REASON}"
          [ "$STATE" = "PASS" ]
